<style>
  :root{
    --bg:#f1f5f9;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
    --brand:#0f766e;--brand2:#0d9488;--brand-soft:#ccfbf1;
    --c1:#2563eb;--c2:#0d9488;--c3:#d97706;--c4:#dc2626;--c5:#7c3aed;--c6:#0891b2;--c7:#db2777;
    --good:#059669;--warn:#d97706;--bad:#dc2626;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);--radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  .app{display:flex;min-height:100vh}
  .side{width:240px;background:#0b1f1d;color:#cbd5e1;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:30px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 14px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .logo{display:flex;gap:9px;align-items:center;justify-content:center;max-width:210px}
  .brand .logo img{max-height:46px;max-width:170px;width:auto;height:auto;object-fit:contain;display:block}
  .brand .logo img.dual{max-height:28px;max-width:78px}
  .brand b{color:#fff;font-size:15px;display:block;line-height:1.15}
  .brand span{font-size:11px;color:#94a3b8}
  .nav{padding:12px 10px}
  .nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f7a76;padding:14px 12px 6px}
  .nav button{width:100%;text-align:left;background:none;border:0;color:#cbd5e1;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--brand);color:#fff;font-weight:600}
  .nav .ic{width:18px;text-align:center;opacity:.9}
  .nav .car{margin-left:auto;font-size:10px;transition:.15s;opacity:.7}
  .nav .parent.open .car{transform:rotate(90deg)}
  .nav .sub{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .nav .parent.open + .sub{max-height:300px}
  .nav .sub button{padding-left:40px;font-size:12.5px;color:#9fb3af}
  .nav .sub button.active{background:rgba(13,148,136,.22);color:#fff;font-weight:600}
  .main{flex:1;min-width:0}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;gap:12px}
  .topbar h1{font-size:17px;margin:0}
  .topbar .crumb{font-size:12px;color:var(--muted)}
  .pill{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px}
  .pill.live{background:#dcfce7;color:#166534}.pill.snap{background:#fef3c7;color:#92400e}
  .btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand);display:inline-flex;gap:6px;align-items:center}
  .btn:hover{background:var(--brand-soft)}
  .wrap{padding:22px 30px;max-width:none}
  .sec{display:none}.sec.show{display:block}
  h2.sh{font-size:15px;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
  h2.sh:first-child{margin-top:4px}
  h2.sh .dot{width:8px;height:8px;border-radius:50%;background:var(--brand2)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:13px;color:var(--muted);font-weight:500}
  .kpi .val{font-size:32px;font-weight:800;margin-top:8px;letter-spacing:-.6px}
  .kpi .chg{font-size:12px}
  .kpi .chg{font-size:11.5px;margin-top:4px;font-weight:600}
  .up{color:var(--good)}.down{color:var(--bad)}
  .grid{display:grid;gap:16px;align-items:start}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative}
  .card h3{margin:0 0 4px;font-size:16px}.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .link{cursor:pointer;transition:.15s}
  .link:hover{border-color:var(--brand2);box-shadow:0 8px 24px rgba(15,23,42,.12);transform:translateY(-2px)}
  .link .go{position:absolute;top:16px;right:18px;font-size:12px;font-weight:700;color:var(--brand);opacity:.6}
  .link:hover .go{opacity:1}
  .chartbox{position:relative;width:100%}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.big{font-size:14px}table.big th{font-size:12px;padding:10px 12px}table.big td{padding:12px 12px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9}tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f8fafc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;display:inline-block}
  .t-green{background:#dcfce7;color:#166534}.t-amber{background:#fef3c7;color:#92400e}.t-red{background:#fee2e2;color:#991b1b}.t-gray{background:#f1f5f9;color:#475569}.t-blue{background:#dbeafe;color:#1e40af}
  table.ppjb tbody tr:not(.mrow):nth-child(even){background:#fbfcfe}
  table.ppjb .mrow td{background:#eef2f7;color:#0f172a;font-weight:700;font-size:12px;padding:7px 10px;border-bottom:1px solid #e2e8f0}
  table.ppjb tbody tr.mrow:hover{background:#eef2f7}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:#0f766e;display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-right:8px}
  .mini{font-size:11.5px;color:var(--muted)}
  .note{border:1px solid #fde68a;background:#fffbeb;color:#92400e;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px}
  .warnbox{border:2px solid #dc2626;background:#fef2f2;border-radius:12px;padding:14px 16px;margin-bottom:18px;cursor:pointer;animation:warnpulse 1.4s ease-in-out infinite}
  @keyframes warnpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
  .warnhead{display:flex;align-items:center;gap:8px;color:#991b1b;font-size:14px}
  .blink{animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.15}}
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:820px){.wgrid{grid-template-columns:1fr}}
  .wcard{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .wcard .wleft{flex:0 0 auto}
  .wcard .wt{font-size:11.5px;font-weight:700;color:#b91c1c;letter-spacing:.02em}
  .wcard .wn{margin:8px 0 4px;font-size:15px;display:flex;align-items:center}
  .wcard .wv{font-size:20px;font-weight:800;color:#0f172a}
  .wcard .wsub{flex:1;font-size:11.5px;color:#64748b;line-height:1.55;border-left:1px solid #fde2e2;padding-left:12px}
  .wcard .go2{color:var(--brand);font-weight:700;opacity:.55;font-size:12px}
  .wcard.link:hover .go2{opacity:1}
  .wcard .wavg{font-size:11px;color:#94a3b8;margin-top:3px}
  .ratio{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 2px}
  .ratio .rc{flex:1;min-width:180px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:11px 14px}
  .ratio .rc .rl{font-size:11.5px;color:#1e40af;font-weight:700}
  .ratio .rc .rv{font-size:19px;font-weight:800;color:#0f172a;margin-top:2px}
  .ratio .rc .rv small{font-size:12px;font-weight:600;color:#64748b}
  @media(max-width:820px){.wcard{flex-direction:column;align-items:flex-start}.wcard .wsub{border-left:0;border-top:1px solid #fde2e2;padding-left:0;padding-top:8px;width:100%}}
  .delta{font-size:11px;font-weight:800;white-space:nowrap}
  .delta.up{color:#16a34a}.delta.down{color:#dc2626}.delta.flat{color:#94a3b8}
  .cmp{font-size:12.5px;color:#475569;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
  .catnote{display:inline-block;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.4}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  @media(max-width:900px){.side{display:none}.g2,.g3{grid-template-columns:1fr}.wrap{padding:16px}}
  /* ---- Gateway pilih dashboard ---- */
  #gateway{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#0b1f1d,#1e293b);display:flex;align-items:center;justify-content:center;padding:20px}
  .gw-inner{text-align:center;width:min(96vw,860px)}
  .gw-title{color:#fff;font-size:26px;font-weight:800}
  .gw-sub{color:#94a3b8;font-size:14px;margin:6px 0 26px}
  .gw-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:720px){.gw-cards{grid-template-columns:1fr}}
  .gw-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:26px 20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .gw-card:hover{transform:translateY(-4px);border-color:var(--brand2);box-shadow:0 18px 44px rgba(0,0,0,.35)}
  .gw-card .gw-ic{height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .gw-card .gw-ic img{max-height:66px;max-width:172px;width:auto;height:auto;object-fit:contain}
  .gw-card .gw-duo{gap:16px}
  .gw-card .gw-duo img{max-height:50px;max-width:92px}
  .gw-card b{font-size:17px;color:#0f172a}
  .gw-card span{font-size:12.5px;color:#64748b}
  /* ---- Sidebar company switcher ---- */
  #gantiBtn{margin:14px 12px 6px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e2e8f0;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;width:calc(100% - 24px)}
  #gantiBtn:hover{background:rgba(255,255,255,.12)}
  .coName{margin:0 12px 8px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.01em}
  /* ---- Mode Nitro: sembunyikan Konstruksi ---- */
  .mode-nitro [data-sec="konstruksi"],.mode-nitro [data-for="konstruksi"],.mode-nitro [data-div="konstruksi"]{display:none!important}
  /* ---- Mode Komparasi: nav minimal ---- */
  .mode-komparasi .nav .grp,.mode-komparasi .nav>button[data-sec],.mode-komparasi .nav .parent,.mode-komparasi .nav .sub{display:none!important}
  /* ---- Komparasi logo ---- */
  .kmp-head{display:flex;align-items:center;justify-content:center;gap:22px;margin:4px 0 14px}
  .kmp-logo{height:34px;width:auto;max-width:120px;object-fit:contain}
  .kmp-vs{font-size:13px;font-weight:700;color:var(--muted)}
  .kmp-logo-sm{height:20px;width:auto;max-width:64px;object-fit:contain;vertical-align:middle;margin-right:6px}
</style>
</head>

/* ============================================================
   SVG chart renderer (mandiri, tanpa library)
   ============================================================ */
const C={blue:'#2563eb',teal:'#0d9488',amber:'#d97706',red:'#dc2626',violet:'#7c3aed',cyan:'#0891b2',pink:'#db2777',slate:'#94a3b8'};
const AX='#94a3b8',GL='#eef2f7';
const fmt=v=>{const r=Math.round(v*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1));};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}
function frame(h){return {W:600,H:h,l:44,r:16,t:30,b:26};}
function plot(f){return {x0:f.l,x1:f.W-f.r,y0:f.t,y1:f.H-f.b,pw:f.W-f.l-f.r,ph:f.H-f.t-f.b};}
function open(f){return `<svg viewBox="0 0 ${f.W} ${f.H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;font-family:Segoe UI,system-ui,sans-serif">`;}
function legend(f,items){let x=f.l;return items.map(it=>{const w=it.name.length*6.6+22;const g=`<rect x="${x}" y="8" width="11" height="11" rx="2" fill="${it.color}"/><text x="${x+15}" y="18" font-size="13" fill="#64748b">${it.name}</text>`;x+=w;return g;}).join('');}
function yGrid(f,max){const p=plot(f);let s='';for(let i=0;i<=4;i++){const y=p.y1-i/4*p.ph;s+=`<line x1="${p.x0}" y1="${y}" x2="${p.x1}" y2="${y}" stroke="${GL}"/><text x="${p.x0-7}" y="${y+4}" font-size="12.5" fill="${AX}" text-anchor="end">${fmt(max*i/4)}</text>`;}return s;}
function xLabels(f,labels){const p=plot(f);const step=p.pw/labels.length;return labels.map((l,i)=>`<text x="${p.x0+(i+0.5)*step}" y="${p.y1+18}" font-size="12.5" fill="#475569" text-anchor="middle">${l}</text>`).join('');}
function rBars(cfg,h){const f=frame(h),p=plot(f);const max=niceMax(Math.max(...cfg.data,1));const step=p.pw/cfg.data.length;const bw=Math.min(step*0.55,50);let s=open(f)+yGrid(f,max);cfg.data.forEach((v,i)=>{const bh=v/max*p.ph;const x=p.x0+(i+0.5)*step-bw/2;const col=Array.isArray(cfg.colors)?cfg.colors[i]:(cfg.color||C.teal);s+=`<rect x="${x}" y="${p.y1-bh}" width="${bw}" height="${bh}" rx="4" fill="${col}"/><text x="${x+bw/2}" y="${p.y1-bh-6}" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">${fmt(v)}</text>`;});return s+xLabels(f,cfg.labels)+'</svg>';}
function rHBar(cfg,h){const f=frame(h);f.l=cfg.lw||122;const p=plot(f);const max=cfg.max||niceMax(Math.max(...cfg.data,1));const n=cfg.data.length;const step=p.ph/n;const bh=Math.min(step*0.62,30);let s=open(f);cfg.data.forEach((v,i)=>{const y=p.y0+(i+0.5)*step-bh/2;const bw=v/max*p.pw;const col=Array.isArray(cfg.colors)?cfg.colors[i]:(cfg.color||C.teal);s+=`<text x="${f.l-9}" y="${y+bh/2+4}" font-size="13" fill="#334155" text-anchor="end">${cfg.labels[i]}</text><rect x="${p.x0}" y="${y}" width="${p.pw}" height="${bh}" rx="4" fill="${GL}"/><rect x="${p.x0}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${col}"/><text x="${p.x0+bw+7}" y="${y+bh/2+4}" font-size="12.5" font-weight="700" fill="#475569">${fmt(v)}${cfg.suffix||''}</text>`;});return s+'</svg>';}
function rDonut(cfg,h){const f=frame(h);const cx=124,cy=f.H/2+4,R=Math.min(f.H*0.40,84),ri=R*0.6;const total=cfg.data.reduce((a,b)=>a+b,0)||1;let ang=-Math.PI/2;let s=open(f);cfg.data.forEach((v,i)=>{const a0=ang,a1=ang+v/total*Math.PI*2;ang=a1;const large=(a1-a0)>Math.PI?1:0;const xo0=cx+R*Math.cos(a0),yo0=cy+R*Math.sin(a0),xo1=cx+R*Math.cos(a1),yo1=cy+R*Math.sin(a1),xi1=cx+ri*Math.cos(a1),yi1=cy+ri*Math.sin(a1),xi0=cx+ri*Math.cos(a0),yi0=cy+ri*Math.sin(a0);s+=`<path d="M ${xo0} ${yo0} A ${R} ${R} 0 ${large} 1 ${xo1} ${yo1} L ${xi1} ${yi1} A ${ri} ${ri} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${cfg.colors[i]}"/>`;});s+=`<text x="${cx}" y="${cy}" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">${total>=1000?(total/1000).toFixed(1)+'k':total}</text><text x="${cx}" y="${cy+18}" font-size="12" fill="#94a3b8" text-anchor="middle">total</text>`;let ly=cy-cfg.data.length*11+8;cfg.labels.forEach((l,i)=>{const pct=Math.round(cfg.data[i]/total*100);s+=`<rect x="248" y="${ly-11}" width="12" height="12" rx="2" fill="${cfg.colors[i]}"/><text x="266" y="${ly}" font-size="13" fill="#334155">${l}</text><text x="${f.W-f.r}" y="${ly}" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">${pct}%</text>`;ly+=23;});return s+'</svg>';}
function chart(cfg,h){if(cfg.type==='bars')return rBars(cfg,h);if(cfg.type==='hbar')return rHBar(cfg,h);if(cfg.type==='donut')return rDonut(cfg,h);return '';}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch!=='\r')cur+=ch;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const isNum=s=>{s=String(s==null?'':s).trim();return s!==''&&!isNaN(s);};
async function fetchCSV(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text());}

/* Parse tabel DETAIL lead & survei di dalam tab RSCH (kolom marketing×sumber×proyek×status). */
function parseRSCHDetail(rows){
  const leads=[],surveis=[];
  let hi=-1,MK=[],SM=[],PR=[];
  for(let i=0;i<Math.min(rows.length,50);i++){
    const low=(rows[i]||[]).map(c=>(c==null?'':String(c)).trim().toLowerCase());
    const mk=[],sm=[],pr=[];
    low.forEach((c,j)=>{if(c==='marketing')mk.push(j);if(c==='sumber')sm.push(j);if(c==='proyek')pr.push(j);});
    if(mk.length&&sm.length&&pr.length){hi=i;MK=mk;SM=sm;PR=pr;break;}
  }
  if(hi<0)return {leads,surveis};
  const clean=v=>(v==null?'':String(v)).trim();
  const rMK=MK[0],rPR=PR[0],rSM=SM[0],rKET=SM[0]+1;
  const sMK=MK[1]!=null?MK[1]:-1,sPR=PR[1]!=null?PR[1]:-1,sSM=SM[1]!=null?SM[1]:-1;
  // kolom detail survei (konsumen, tanggal, status prospek, status closing) — dicari dari baris header
  const hdr=(rows[hi]||[]).map(c=>(c==null?'':String(c)).trim().toLowerCase());
  const findFrom=(pred,from)=>{for(let j=Math.max(0,from||0);j<hdr.length;j++){if(pred(hdr[j]))return j;}return -1;};
  const sKON = sMK>=0?findFrom(c=>c==='konsumen',sMK):-1;
  const sTGL = sMK>=0?findFrom(c=>/^tanggal/.test(c),sMK):-1;
  const sPROS= findFrom(c=>c.includes('status')&&c.includes('prospek'),0);
  const sCLOS= findFrom(c=>c.includes('status')&&(c.includes('clos')||c.includes('closs')),0);
  const nameOk=v=>v&&v.toLowerCase()!=='marketing'&&isNaN(v);
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const mk=clean(r[rMK]);
    if(nameOk(mk))leads.push({marketing:mk,proyek:clean(r[rPR]),sumber:clean(r[rSM]),status:clean(r[rKET])});
    if(sMK>=0){const smk=clean(r[sMK]);if(nameOk(smk))surveis.push({marketing:smk,proyek:clean(r[sPR]),sumber:clean(r[sSM]),
      konsumen:sKON>=0?clean(r[sKON]):'',tanggal:sTGL>=0?clean(r[sTGL]):'',prospek:sPROS>=0?clean(r[sPROS]):'',closing:sCLOS>=0?clean(r[sCLOS]):''});}
  }
  return {leads,surveis};
}

function buildFromRows(rschRows, closingRows){
  const AB={},CD={};
  rschRows.forEach(r=>{
    const a=(r[0]||'').trim(),b=r[1],c=(r[2]||'').trim(),d=r[3];
    if(a&&isNum(b))AB[a]=Number(String(b).trim());
    if(c&&isNum(d))CD[c]=Number(String(d).trim());
  });
  const respon={},survei={};
  MARKETERS.forEach(m=>{respon[m]=AB[m]??0;survei[m]=CD[m]??0;});
  const proyekRespon={},proyekSurvei={};
  PROJECTS.forEach(p=>{if(AB[p]!=null)proyekRespon[p]=AB[p];if(CD[p]!=null)proyekSurvei[p]=CD[p];});
  const sumber={};SUMBER.forEach(s=>{if(CD[s]!=null&&CD[s]>0)sumber[s]=CD[s];});
  const data={
    funnel:{respon:AB['Total Respon online']??0,noRespon:AB['No Respon']??0,intens:AB['Intens']??0,tertarik:AB['Tertarik Survei']??0,survei:CD['Total Survei Lokasi']??0},
    respon,survei,proyekRespon,proyekSurvei,sumber,
    konstruksi:KONSTRUKSI_STAFF.map(n=>({name:n,respon:AB[n]||0,survei:CD[n]||0})),
    media:MEDIA_STAFF.map(n=>({name:n,respon:AB[n]||0,survei:CD[n]||0})),
    closing:{count:0,latest:null}
  };
  const det=parseRSCHDetail(rschRows);data.leads=det.leads;data.surveis=det.surveis;
  if(closingRows&&closingRows.length){
    const body=closingRows.filter(r=>{const m=(r[1]||'').trim();return m!==''&&m.toLowerCase()!=='nama marketing';});
    const countUnits=u=>{const s=(u||'').trim();if(!s)return 1;const parts=s.split(/\s*(?:&|\+|,|\/|\bdan\b)\s*/i).map(x=>x.trim()).filter(Boolean);return parts.length||1;};
    const list=body.map(r=>({tgl:(r[3]||'').trim(),konsumen:(r[2]||'').trim(),marketing:(r[1]||'').trim(),proyek:(r[5]||'').trim(),unit:(r[6]||'').trim(),units:countUnits(r[6])}));
    const totalUnits=list.reduce((a,c)=>a+c.units,0);
    data.closing={count:list.length,units:totalUnits,list,latest:list[list.length-1]||null};
  }
  return data;
}

function teamAgg(data){
  const out={};
  for(const t in TEAMS){const names=[...TEAMS[t].members,TEAMS[t].leader];
    out[t]={respon:names.reduce((a,n)=>a+(data.respon[n]||0),0),survei:names.reduce((a,n)=>a+(data.survei[n]||0),0)};}
  return out;
}
function topN(obj,n){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function kpi(lab,val,chg,cls){return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="chg ${cls||'mini'}" ${cls?'':'style="color:var(--muted)"'}>${chg||''}</div></div>`;}
function chartH(cfg,sm){if(cfg.type==='donut')return sm?225:240;if(cfg.type==='bars')return sm?255:290;if(cfg.type==='hbar'){const n=(cfg.data||[]).length;return Math.max(sm?210:250,60+n*(sm?24:27));}return sm?265:300;}

function parsePPJB(rows){

  const h=rows[hi].map(c=>(c||'').trim().toLowerCase());const col=n=>h.findIndex(x=>x.includes(n));
  const cM=col('nama marketing'),cK=col('nama konsumen'),cT=col('tanggal'),cP=col('proyek'),cKav=col('kavling'),cL=col('luas'),cS=col('status'),cKet=col('keterangan');
  const out=[];const push=(r,o)=>{const kon=((r[cK+o]||'')+'').trim();if(!kon||/nama konsumen/i.test(kon))return;
    out.push({marketing:((r[cM+o]||'')+'').trim(),konsumen:kon,tanggal:((r[cT+o]||'')+'').trim(),proyek:((r[cP+o]||'')+'').trim(),kavling:((r[cKav+o]||'')+'').trim(),luas:parseFloat((((r[cL+o]||'')+'').replace(/[^0-9.]/g,'')))||0,status:((r[cS+o]||'')+'').trim(),keterangan:((r[cKet+o]||'')+'').trim()});};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];push(r,0);push(r,10);}
  return out;
}

function parseTgl(t){const s=(t||'').toLowerCase();let mi=-1;for(let i=0;i<12;i++){if(s.includes(MONTHS[i].toLowerCase().slice(0,3))){mi=i;break;}}const ym=s.match(/\b(20\d{2})\b/);const y=ym?+ym[1]:null;if(mi<0||!y)return {k:Infinity,label:'Tanggal lain',short:'—'};return {k:y*12+mi,label:MONTHS[mi]+' '+y,short:MONTHS[mi].slice(0,3)+" '"+String(y).slice(2)};}
/* Kunci urut per-hari (buang nama hari mis. "Sabtu, 20 Juni 2026"); -1 kalau tak terbaca */
function tglSortKey(t){const s=(t||'').toLowerCase();let mi=-1;for(let i=0;i<12;i++){if(s.includes(MONTHS[i].toLowerCase().slice(0,3))){mi=i;break;}}const ym=s.match(/\b(20\d{2})\b/);const dm=s.match(/\b(\d{1,2})\b/);if(mi<0||!ym)return -1;return (+ym[1])*10000+mi*100+(dm?+dm[1]:0);}

/* Analisis marketing paling perlu didorong — skor gabungan respon+survei+closing+konversi (per bulan aktif) */
function leastPerformer(data){
  const roster=[];Object.values(TEAMS).forEach(t=>{roster.push(t.leader);t.members.forEach(m=>roster.push(m));});
  const uniq=[...new Set(roster)];if(!uniq.length)return [];
  const clCount={};(data.closing.list||[]).forEach(c=>{const m=(c.marketing||'').trim();if(m)clCount[m]=(clCount[m]||0)+(c.units||1);});
  const rows=uniq.map(n=>{const respon=data.respon[n]||0,survei=data.survei[n]||0,closing=clCount[n]||0;
    return {n,respon,survei,closing,convS:respon?survei/respon:0,convC:survei?closing/survei:0};});
  const mx=k=>Math.max(1,...rows.map(r=>r[k]));const mR=mx('respon'),mS=mx('survei'),mC=mx('closing');
  rows.forEach(r=>{r.score=0.20*(r.respon/mR)+0.30*(r.survei/mS)+0.35*(r.closing/mC)+0.15*Math.min(1,r.convS);});
  rows.sort((a,b)=>a.score-b.score||a.respon-b.respon||a.n.localeCompare(b.n));
  return rows;
}

  let hi=rows.findIndex(r=>r.filter(c=>(c||'').trim()!=='').length>=2);if(hi<0)hi=0;
  let header=rows[hi].map(c=>(c||'').trim());

  return {header,data};
}

/* ============================================================
   NITRO — parser tab-tab asli (Summary pivot + tab detail)
   ============================================================ */
function nInt(v){if(v==null)return 0;const s=String(v).replace(/[^0-9\-]/g,'');return s&&s!=='-'?parseInt(s,10):0;}
function nRp(v){if(v==null)return 0;const s=String(v).replace(/[^0-9]/g,'');return s?parseInt(s,10):0;}
function nRows(rows){return (rows||[]).map(r=>(r||[]).map(c=>(c==null?'':String(c)).trim()));}
function nLow(r){return (r||[]).map(c=>(c==null?'':String(c)).trim().toLowerCase());}
function nFlat(rows){return rows.slice(0,60).map(r=>(r||[]).join('|')).join('\n').toLowerCase();}
/* deteksi jenis tab Nitro dari isi header */
function nClassify(rows){
  const f=nFlat(rows);
  if(/respon-survey-closing|asal respon|sebaran iklan/.test(f))return 'summary';
  if(/data hot prospek|total transaksi/.test(f))return 'hot';
  if(/tanggal deal|harga deal/.test(f))return 'closing';
  if(/tanggal survei|analisa sementara/.test(f))return 'survey';
  if(/tanggal respon|minat lokasi/.test(f))return 'respon';
  return 'unknown';
}
/* cari indeks kolom pada baris header via daftar regex */
function nColMap(hdr,spec){const l=nLow(hdr);const out={};for(const k in spec){out[k]=l.findIndex(c=>spec[k].test(c));}return out;}
/* --- tab Summary: Section A (funnel/marketing) + B (asal respon) + C (sebaran proyek) --- */
function parseNitroSummary(rowsRaw,data){
  const rows=nRows(rowsRaw);
  // Section A header
  let hA=-1,cA=null;
  for(let i=0;i<Math.min(rows.length,14);i++){
    const l=nLow(rows[i]);const iMkt=l.indexOf('marketing');
    if(iMkt>=0 && l.some(c=>c==='respon') && l.some(c=>/closing/.test(c)) && l.some(c=>/nominal/.test(c))){
      hA=i;cA={mkt:iMkt,respon:l.indexOf('respon'),survey:l.findIndex(c=>c==='survey'||c==='survei'),
        hot:l.findIndex(c=>/hot|prospek/.test(c)),closing:l.findIndex(c=>c==='closing'),nominal:l.findIndex(c=>/nominal/.test(c)),
        mpfb:l.findIndex(c=>/mp ?fb/.test(c)),wa:l.findIndex(c=>/wa ?ads/.test(c)),meta:l.findIndex(c=>/meta ?ads/.test(c)),
        tiktok:l.findIndex(c=>/tiktok/.test(c)),ignon:l.findIndex(c=>/ig non/.test(c)),olx:l.findIndex(c=>/olx/.test(c)),
        lamudi:l.findIndex(c=>/lamudi/.test(c)),r123:l.findIndex(c=>/rumah ?123/.test(c)),n99:l.findIndex(c=>/99/.test(c)),
        igads:l.findIndex(c=>/^ig ads/.test(c)||/[^n] ig ads/.test(c)),db:l.findIndex(c=>/database/.test(c)),walk:l.findIndex(c=>/walk/.test(c))};
      break;
    }
  }
  const respon={},survei={},hot={},nominal={},sumber={},marketers=[];
  const srcMap=[['Meta Ads','meta'],['MP FB','mpfb'],['WA Ads','wa'],['Tiktok','tiktok'],['IG Non Ads','ignon'],['OLX','olx'],['Lamudi','lamudi'],['Rumah123','r123'],['99.co','n99'],['IG Ads','igads'],['Database','db'],['Walk In','walk']];
  let totC=0,totNom=0;
  if(hA>=0){
    for(let i=hA+1;i<rows.length;i++){
      const r=rows[i];const name=(r[cA.mkt]||'').trim();
      if(!name){ if(marketers.length)break; else continue; }
      if(/^total$/i.test(name))break;
      if(/^\d+$/.test(name))continue;
      respon[name]=nInt(r[cA.respon]);
      survei[name]=cA.survey>=0?nInt(r[cA.survey]):0;
      hot[name]=cA.hot>=0?nInt(r[cA.hot]):0;
      const cl=cA.closing>=0?nInt(r[cA.closing]):0;totC+=cl;
      const nm=cA.nominal>=0?nRp(r[cA.nominal]):0;nominal[name]=nm;totNom+=nm;
      srcMap.forEach(([lbl,key])=>{const idx=cA[key];if(idx>=0){const v=nInt(r[idx]);if(v)sumber[lbl]=(sumber[lbl]||0)+v;}});
      marketers.push(name);
    }
  }
  // Section C: sebaran per proyek (respon/closing per Nama Proyek)
  let hC=-1,cC=null;
  for(let i=(hA>=0?hA+1:0);i<rows.length;i++){
    const l=nLow(rows[i]);const iP=l.findIndex(c=>/nama proyek/.test(c));
    if(iP>=0 && l.some(c=>c==='respon')){hC=i;cC={proyek:iP,respon:l.indexOf('respon'),survey:l.findIndex(c=>c==='survey'||c==='survei'),closing:l.findIndex(c=>c==='closing')};break;}
  }
  const proyekRespon={},proyekSurvei={};
  if(hC>=0){let started=false;
    for(let i=hC+1;i<rows.length;i++){
      const r=rows[i];const p=(r[cC.proyek]||'').trim();
      if(!p){ if(started)break; else continue; }
      if(/^total$/i.test(p))break;
      if(/^\d+$/.test(p))continue;
      started=true;
      const rv=nInt(r[cC.respon]);if(rv)proyekRespon[p]=rv;
      const sv=cC.survey>=0?nInt(r[cC.survey]):0;if(sv)proyekSurvei[p]=sv;
    }
  }
  const totR=Object.values(respon).reduce((a,b)=>a+b,0);
  const totS=Object.values(survei).reduce((a,b)=>a+b,0);
  const totH=Object.values(hot).reduce((a,b)=>a+b,0);
  data.funnel={respon:totR,noRespon:0,intens:0,tertarik:0,survei:totS,hotProspek:totH};
  data.respon=respon;data.survei=survei;data.nitroHot=hot;
  data.sumber=Object.keys(sumber).length?sumber:data.sumber;
  data.proyekRespon=Object.keys(proyekRespon).length?proyekRespon:data.proyekRespon;
  data.proyekSurvei=Object.keys(proyekSurvei).length?proyekSurvei:data.proyekSurvei;
  // closing count/nominal dari Summary (detail nama nyusul dari tab CLOSING)
  if(!data.closing.list.length){data.closing.count=totC;data.closing.units=totC;data.closing.nominal=totNom;}
  data._nitroMarketers=marketers;
  return data;
}
/* --- tab CLOSING Nitro: detail transaksi --- */
function parseNitroClosing(rowsRaw,data){
  const rows=nRows(rowsRaw);
  let h=-1,c=null;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const l=nLow(rows[i]);
    if(l.some(x=>/nama konsumen/.test(x)) && l.some(x=>x==='marketing')){
      h=i;c={kons:l.findIndex(x=>/nama konsumen/.test(x)),tgl:l.findIndex(x=>/tanggal/.test(x)),
        proyek:l.findIndex(x=>/nama proyek/.test(x)),unit:l.findIndex(x=>x==='unit'),mkt:l.indexOf('marketing'),
        nom:l.findIndex(x=>/harga deal/.test(x))};break;}
  }
  if(h<0)return data;
  const list=[];const countUnits=u=>{const s=(u||'').trim();if(!s)return 1;const p=s.split(/\s*(?:&|\+|,|\/|\bdan\b)\s*/i).map(x=>x.trim()).filter(Boolean);return p.length||1;};
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];const kons=(r[c.kons]||'').trim();const mkt=c.mkt>=0?(r[c.mkt]||'').trim():'';
    if(!kons&&!mkt)continue;if(/^total/i.test(kons))continue;
    const unit=c.unit>=0?(r[c.unit]||'').trim():'';
    list.push({tgl:c.tgl>=0?(r[c.tgl]||'').trim():'',konsumen:kons,marketing:mkt,proyek:c.proyek>=0?(r[c.proyek]||'').trim():'',unit,units:countUnits(unit),nominal:c.nom>=0?nRp(r[c.nom]):0});
  }
  if(list.length){data.closing={count:list.length,units:list.reduce((a,x)=>a+x.units,0),list,latest:list[list.length-1]||null,nominal:list.reduce((a,x)=>a+(x.nominal||0),0)};}
  return data;
}
/* --- tab Data Respon Nitro: leads detail --- */
function parseNitroRespon(rowsRaw,data){

async function fetchMonthNitro(m){
  const jobs=[[m.csvA,'summary'],[m.csvClosing,'closing'],[m.csvRespon,'respon'],[m.csvSurvey,'survey'],[m.csvHot,'hot']]
    .filter(x=>x[0]);
  if(!jobs.length)return null;
  const results=await Promise.all(jobs.map(async ([url,hint])=>{try{return {rows:await fetchCSV(url),hint};}catch(e){return null;}}));
  const buckets={};
  results.forEach(res=>{if(!res||!res.rows)return;let k=nClassify(res.rows);if(k==='unknown')k=res.hint;if(!buckets[k])buckets[k]=res.rows;});
  if(!buckets.summary && !buckets.respon && !buckets.closing)return null;
  let data=emptyData();
  if(buckets.summary)data=parseNitroSummary(buckets.summary,data);
  if(buckets.closing)data=parseNitroClosing(buckets.closing,data);
  if(buckets.respon)data=parseNitroRespon(buckets.respon,data);
  if(buckets.survey)data=parseNitroSurvey(buckets.survey,data);
  if(buckets.hot)data=parseNitroHot(buckets.hot,data);
  data._nitro=true;
  return data;
}

function setBrand(name,sub){const n=document.getElementById('brandName'),s=document.getElementById('brandSub');if(n)n.textContent=name;if(s)s.textContent=sub;}
function setBrandLogo(html){const l=document.getElementById('brandLogo');if(l)l.innerHTML=html;}
function applyCompanyConfig(co){const c=COMPANIES[co];if(!c)return;RSC_MONTHS=c.RSC_MONTHS;SHEET_LH=c.SHEET_LH;if(c.SHEET_PPJB)SHEET_PPJB=c.SHEET_PPJB;if(c.MARKETERS)MARKETERS=c.MARKETERS;if(c.PROJECTS)PROJECTS=c.PROJECTS;if(c.SUMBER)SUMBER=c.SUMBER;document.getElementById('coName').textContent=c.sub||c.label;setBrand(c.label,'Dashboard RSC — Live');setBrandLogo(`<img alt="${c.label}" src="${co==='nitro'?LOGO_NITRO_LIGHT:LOGO_GSR}">`);}
function enterView(v){
  VIEW=v;document.getElementById('gateway').style.display='none';
  applyCompanyConfig(v==='nitro'?'nitro':'garuda');
  document.body.classList.remove('mode-garuda','mode-nitro','mode-komparasi');
  document.body.classList.add('mode-'+v);
  if(v==='komparasi'){document.getElementById('coName').textContent='GSR × Nitro';setBrand('Helicopter View','GSR & Nitro Megah Properti');setBrandLogo(`<img class="dual" src="${LOGO_GSR}"><img class="dual" src="${LOGO_NITRO_LIGHT}">`);}
  const co=(v==='nitro')?'nitro':'garuda';
  const needLoad=!BOOTED||(co!==LOADED_CO);
  if(needLoad){BOOTED=true;LOADED_CO=co;renderKonstruksi();loadAll().then(()=>{if(VIEW==='komparasi')renderKomparasi();});}
  else if(v==='komparasi')renderKomparasi();
  goTab(v==='komparasi'?'komparasi':'overview');
}
function renderKomparasi(){
  const el=document.getElementById('komparasi');if(!el)return;
  const R=SUM.respon||{},P=SUM.ppjb||{},L=SUM.lokasi||{},M=SUM.media||{};
  const fmt=v=>v==null?'—':v;
  const rows=[['Total Respon Online',R.total,R.total],['Survei Lokasi',R.survei,R.survei],['Closing (unit)',R.closing,R.closing],['PPJB Terlaksana',P.total,P.total],['Calon Lokasi (Land Hunter)',L.total,L.total],['Konten Media (dikelola bersama)',M.total,M.total]];
  const trs=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td class="num">${fmt(r[1])}</td><td class="num">${fmt(r[2])}</td></tr>`).join('');
  el.innerHTML=`
    <div class="note">⚖️ Helicopter View menampilkan data perusahaan yang sedang di-load. Versi side-by-side dua data sekaligus menyusul. Land Hunter Nitro belum ada datanya. Media &amp; HRD dikelola bersama untuk 2 cabang.</div>
    <div class="kmp-head"><img class="kmp-logo" src="${LOGO_GSR}" alt="GSR"><span class="kmp-vs">vs</span><img class="kmp-logo" src="${LOGO_NITRO}" alt="Nitro"></div>
    <h2 class="sh"><span class="dot"></span>Ringkasan GSR vs Nitro</h2>
    <div class="card"><div style="overflow:auto"><table class="big"><thead><tr><th>Metrik</th><th class="num">GSR (Jogja)</th><th class="num">Nitro Megah Properti</th></tr></thead><tbody>${trs}</tbody></table></div></div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h3><img class="kmp-logo-sm" src="${LOGO_GSR}"> Garuda Sukses Raya <span class="mini">Jogja</span></h3><div class="kpis">${kpi('Respon',R.total||0,'leads')+kpi('Closing',R.closing||0,'unit')+kpi('PPJB',P.total||0,'berkas')+kpi('Calon Lokasi',L.total||0,'land hunter')}</div></div>
      <div class="card"><h3><img class="kmp-logo-sm" src="${LOGO_NITRO}"> Nitro Megah Properti <span class="mini">(Madiun)</span></h3><div class="kpis">${kpi('Respon',R.total||0,'leads')+kpi('Closing',R.closing||0,'unit')+kpi('PPJB',P.total||0,'berkas')+kpi('Calon Lokasi',L.total||0,'land hunter')}</div></div>
    </div>`;
}
showGateway();
</script>
</body>
</html>

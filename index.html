<style>
  :root{
    --bg:#f1f5f9;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
    --brand:#0f766e;--brand2:#0d9488;--brand-soft:#ccfbf1;
    --c1:#2563eb;--c2:#0d9488;--c3:#d97706;--c4:#dc2626;--c5:#7c3aed;--c6:#0891b2;--c7:#db2777;
    --good:#059669;--warn:#d97706;--bad:#dc2626;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);--radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  .app{display:flex;min-height:100vh}
  .side{width:240px;background:#0b1f1d;color:#cbd5e1;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:30px}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .logo{width:44px;height:50px;display:grid;place-items:center}
  .brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
  .brand b{color:#fff;font-size:15px;display:block;line-height:1.1}
  .brand span{font-size:11px;color:#94a3b8}
  .nav{padding:12px 10px}
  .nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f7a76;padding:14px 12px 6px}
  .nav button{width:100%;text-align:left;background:none;border:0;color:#cbd5e1;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--brand);color:#fff;font-weight:600}
  .nav .ic{width:18px;text-align:center;opacity:.9}
  .nav .car{margin-left:auto;font-size:10px;transition:.15s;opacity:.7}
  .nav .parent.open .car{transform:rotate(90deg)}
  .nav .sub{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .nav .parent.open + .sub{max-height:300px}
  .nav .sub button{padding-left:40px;font-size:12.5px;color:#9fb3af}
  .nav .sub button.active{background:rgba(13,148,136,.22);color:#fff;font-weight:600}
  .main{flex:1;min-width:0}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;gap:12px}
  .topbar h1{font-size:17px;margin:0}
  .topbar .crumb{font-size:12px;color:var(--muted)}
  .pill{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px}
  .pill.live{background:#dcfce7;color:#166534}.pill.snap{background:#fef3c7;color:#92400e}
  .btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand);display:inline-flex;gap:6px;align-items:center}
  .btn:hover{background:var(--brand-soft)}
  .wrap{padding:22px 30px;max-width:none}
  .sec{display:none}.sec.show{display:block}
  h2.sh{font-size:15px;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
  h2.sh:first-child{margin-top:4px}
  h2.sh .dot{width:8px;height:8px;border-radius:50%;background:var(--brand2)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:13px;color:var(--muted);font-weight:500}
  .kpi .val{font-size:32px;font-weight:800;margin-top:8px;letter-spacing:-.6px}
  .kpi .chg{font-size:12px}
  .kpi .chg{font-size:11.5px;margin-top:4px;font-weight:600}
  .up{color:var(--good)}.down{color:var(--bad)}
  .grid{display:grid;gap:16px;align-items:start}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative}
  .card h3{margin:0 0 4px;font-size:16px}.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .link{cursor:pointer;transition:.15s}
  .link:hover{border-color:var(--brand2);box-shadow:0 8px 24px rgba(15,23,42,.12);transform:translateY(-2px)}
  .link .go{position:absolute;top:16px;right:18px;font-size:12px;font-weight:700;color:var(--brand);opacity:.6}
  .link:hover .go{opacity:1}
  .chartbox{position:relative;width:100%}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.big{font-size:14px}table.big th{font-size:12px;padding:10px 12px}table.big td{padding:12px 12px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9}tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f8fafc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;display:inline-block}
  .t-green{background:#dcfce7;color:#166534}.t-amber{background:#fef3c7;color:#92400e}.t-red{background:#fee2e2;color:#991b1b}.t-gray{background:#f1f5f9;color:#475569}.t-blue{background:#dbeafe;color:#1e40af}
  table.ppjb tbody tr:not(.mrow):nth-child(even){background:#fbfcfe}
  table.ppjb .mrow td{background:#eef2f7;color:#0f172a;font-weight:700;font-size:12px;padding:7px 10px;border-bottom:1px solid #e2e8f0}
  table.ppjb tbody tr.mrow:hover{background:#eef2f7}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:#0f766e;display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-right:8px}
  .mini{font-size:11.5px;color:var(--muted)}
  .note{border:1px solid #fde68a;background:#fffbeb;color:#92400e;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px}
  .warnbox{border:2px solid #dc2626;background:#fef2f2;border-radius:12px;padding:14px 16px;margin-bottom:18px;cursor:pointer;animation:warnpulse 1.4s ease-in-out infinite}
  @keyframes warnpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
  .warnhead{display:flex;align-items:center;gap:8px;color:#991b1b;font-size:14px}
  .blink{animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.15}}
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:820px){.wgrid{grid-template-columns:1fr}}
  .wcard{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .wcard .wleft{flex:0 0 auto}
  .wcard .wt{font-size:11.5px;font-weight:700;color:#b91c1c;letter-spacing:.02em}
  .wcard .wn{margin:8px 0 4px;font-size:15px;display:flex;align-items:center}
  .wcard .wv{font-size:20px;font-weight:800;color:#0f172a}
  .wcard .wsub{flex:1;font-size:11.5px;color:#64748b;line-height:1.55;border-left:1px solid #fde2e2;padding-left:12px}
  @media(max-width:820px){.wcard{flex-direction:column;align-items:flex-start}.wcard .wsub{border-left:0;border-top:1px solid #fde2e2;padding-left:0;padding-top:8px;width:100%}}
  .delta{font-size:11px;font-weight:800;white-space:nowrap}
  .delta.up{color:#16a34a}.delta.down{color:#dc2626}.delta.flat{color:#94a3b8}
  .cmp{font-size:12.5px;color:#475569;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
  .catnote{display:inline-block;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.4}

/* ============================================================
   SVG chart renderer (mandiri, tanpa library)
   ============================================================ */
const C={blue:'#2563eb',teal:'#0d9488',amber:'#d97706',red:'#dc2626',violet:'#7c3aed',cyan:'#0891b2',pink:'#db2777',slate:'#94a3b8'};
const AX='#94a3b8',GL='#eef2f7';
const fmt=v=>{const r=Math.round(v*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1));};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}
function frame(h){return {W:600,H:h,l:44,r:16,t:30,b:26};}
function plot(f){return {x0:f.l,x1:f.W-f.r,y0:f.t,y1:f.H-f.b,pw:f.W-f.l-f.r,ph:f.H-f.t-f.b};}
function open(f){return `<svg viewBox="0 0 ${f.W} ${f.H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;font-family:Segoe UI,system-ui,sans-serif">`;}
function legend(f,items){let x=f.l;return items.map(it=>{const w=it.name.length*6.6+22;const g=`<rect x="${x}" y="8" width="11" height="11" rx="2" fill="${it.color}"/><text x="${x+15}" y="18" font-size="13" fill="#64748b">${it.name}</text>`;x+=w;return g;}).join('');}
function yGrid(f,max){const p=plot(f);let s='';for(let i=0;i<=4;i++){const y=p.y1-i/4*p.ph;s+=`<line x1="${p.x0}" y1="${y}" x2="${p.x1}" y2="${y}" stroke="${GL}"/><text x="${p.x0-7}" y="${y+4}" font-size="12.5" fill="${AX}" text-anchor="end">${fmt(max*i/4)}</text>`;}return s;}
function xLabels(f,labels){const p=plot(f);const step=p.pw/labels.length;return labels.map((l,i)=>`<text x="${p.x0+(i+0.5)*step}" y="${p.y1+18}" font-size="12.5" fill="#475569" text-anchor="middle">${l}</text>`).join('');}
function rBars(cfg,h){const f=frame(h),p=plot(f);const max=niceMax(Math.max(...cfg.data,1));const step=p.pw/cfg.data.length;const bw=Math.min(step*0.55,50);let s=open(f)+yGrid(f,max);cfg.data.forEach((v,i)=>{const bh=v/max*p.ph;const x=p.x0+(i+0.5)*step-bw/2;const col=Array.isArray(cfg.colors)?cfg.colors[i]:(cfg.color||C.teal);s+=`<rect x="${x}" y="${p.y1-bh}" width="${bw}" height="${bh}" rx="4" fill="${col}"/><text x="${x+bw/2}" y="${p.y1-bh-6}" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">${fmt(v)}</text>`;});return s+xLabels(f,cfg.labels)+'</svg>';}
function rHBar(cfg,h){const f=frame(h);f.l=cfg.lw||122;const p=plot(f);const max=cfg.max||niceMax(Math.max(...cfg.data,1));const n=cfg.data.length;const step=p.ph/n;const bh=Math.min(step*0.62,30);let s=open(f);cfg.data.forEach((v,i)=>{const y=p.y0+(i+0.5)*step-bh/2;const bw=v/max*p.pw;const col=Array.isArray(cfg.colors)?cfg.colors[i]:(cfg.color||C.teal);s+=`<text x="${f.l-9}" y="${y+bh/2+4}" font-size="13" fill="#334155" text-anchor="end">${cfg.labels[i]}</text><rect x="${p.x0}" y="${y}" width="${p.pw}" height="${bh}" rx="4" fill="${GL}"/><rect x="${p.x0}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${col}"/><text x="${p.x0+bw+7}" y="${y+bh/2+4}" font-size="12.5" font-weight="700" fill="#475569">${fmt(v)}${cfg.suffix||''}</text>`;});return s+'</svg>';}
function rDonut(cfg,h){const f=frame(h);const cx=124,cy=f.H/2+4,R=Math.min(f.H*0.40,84),ri=R*0.6;const total=cfg.data.reduce((a,b)=>a+b,0)||1;let ang=-Math.PI/2;let s=open(f);cfg.data.forEach((v,i)=>{const a0=ang,a1=ang+v/total*Math.PI*2;ang=a1;const large=(a1-a0)>Math.PI?1:0;const xo0=cx+R*Math.cos(a0),yo0=cy+R*Math.sin(a0),xo1=cx+R*Math.cos(a1),yo1=cy+R*Math.sin(a1),xi1=cx+ri*Math.cos(a1),yi1=cy+ri*Math.sin(a1),xi0=cx+ri*Math.cos(a0),yi0=cy+ri*Math.sin(a0);s+=`<path d="M ${xo0} ${yo0} A ${R} ${R} 0 ${large} 1 ${xo1} ${yo1} L ${xi1} ${yi1} A ${ri} ${ri} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${cfg.colors[i]}"/>`;});s+=`<text x="${cx}" y="${cy}" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">${total>=1000?(total/1000).toFixed(1)+'k':total}</text><text x="${cx}" y="${cy+18}" font-size="12" fill="#94a3b8" text-anchor="middle">total</text>`;let ly=cy-cfg.data.length*11+8;cfg.labels.forEach((l,i)=>{const pct=Math.round(cfg.data[i]/total*100);s+=`<rect x="248" y="${ly-11}" width="12" height="12" rx="2" fill="${cfg.colors[i]}"/><text x="266" y="${ly}" font-size="13" fill="#334155">${l}</text><text x="${f.W-f.r}" y="${ly}" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">${pct}%</text>`;ly+=23;});return s+'</svg>';}
function chart(cfg,h){if(cfg.type==='bars')return rBars(cfg,h);if(cfg.type==='hbar')return rHBar(cfg,h);if(cfg.type==='donut')return rDonut(cfg,h);return '';}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch!=='\r')cur+=ch;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const isNum=s=>{s=String(s==null?'':s).trim();return s!==''&&!isNaN(s);};
async function fetchCSV(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text());}

/* Parse tabel DETAIL lead & survei di dalam tab RSCH (kolom marketing×sumber×proyek×status). */
function parseRSCHDetail(rows){
  const leads=[],surveis=[];
  let hi=-1,MK=[],SM=[],PR=[];
  for(let i=0;i<Math.min(rows.length,50);i++){
    const low=(rows[i]||[]).map(c=>(c==null?'':String(c)).trim().toLowerCase());
    const mk=[],sm=[],pr=[];
    low.forEach((c,j)=>{if(c==='marketing')mk.push(j);if(c==='sumber')sm.push(j);if(c==='proyek')pr.push(j);});
    if(mk.length&&sm.length&&pr.length){hi=i;MK=mk;SM=sm;PR=pr;break;}
  }
  if(hi<0)return {leads,surveis};
  const clean=v=>(v==null?'':String(v)).trim();
  const rMK=MK[0],rPR=PR[0],rSM=SM[0],rKET=SM[0]+1;
  const sMK=MK[1]!=null?MK[1]:-1,sPR=PR[1]!=null?PR[1]:-1,sSM=SM[1]!=null?SM[1]:-1;
  // kolom detail survei (konsumen, tanggal, status prospek, status closing) — dicari dari baris header
  const hdr=(rows[hi]||[]).map(c=>(c==null?'':String(c)).trim().toLowerCase());
  const findFrom=(pred,from)=>{for(let j=Math.max(0,from||0);j<hdr.length;j++){if(pred(hdr[j]))return j;}return -1;};
  const sKON = sMK>=0?findFrom(c=>c==='konsumen',sMK):-1;
  const sTGL = sMK>=0?findFrom(c=>/^tanggal/.test(c),sMK):-1;
  const sPROS= findFrom(c=>c.includes('status')&&c.includes('prospek'),0);
  const sCLOS= findFrom(c=>c.includes('status')&&(c.includes('clos')||c.includes('closs')),0);
  const nameOk=v=>v&&v.toLowerCase()!=='marketing'&&isNaN(v);
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const mk=clean(r[rMK]);
    if(nameOk(mk))leads.push({marketing:mk,proyek:clean(r[rPR]),sumber:clean(r[rSM]),status:clean(r[rKET])});
    if(sMK>=0){const smk=clean(r[sMK]);if(nameOk(smk))surveis.push({marketing:smk,proyek:clean(r[sPR]),sumber:clean(r[sSM]),
      konsumen:sKON>=0?clean(r[sKON]):'',tanggal:sTGL>=0?clean(r[sTGL]):'',prospek:sPROS>=0?clean(r[sPROS]):'',closing:sCLOS>=0?clean(r[sCLOS]):''});}
  }
  return {leads,surveis};
}

function buildFromRows(rschRows, closingRows){
  const AB={},CD={};
  rschRows.forEach(r=>{
    const a=(r[0]||'').trim(),b=r[1],c=(r[2]||'').trim(),d=r[3];
    if(a&&isNum(b))AB[a]=Number(String(b).trim());
    if(c&&isNum(d))CD[c]=Number(String(d).trim());
  });
  const respon={},survei={};
  MARKETERS.forEach(m=>{respon[m]=AB[m]??0;survei[m]=CD[m]??0;});
  const proyekRespon={},proyekSurvei={};
  PROJECTS.forEach(p=>{if(AB[p]!=null)proyekRespon[p]=AB[p];if(CD[p]!=null)proyekSurvei[p]=CD[p];});
  const sumber={};SUMBER.forEach(s=>{if(CD[s]!=null&&CD[s]>0)sumber[s]=CD[s];});
  const data={
    funnel:{respon:AB['Total Respon online']??0,noRespon:AB['No Respon']??0,intens:AB['Intens']??0,tertarik:AB['Tertarik Survei']??0,survei:CD['Total Survei Lokasi']??0},
    respon,survei,proyekRespon,proyekSurvei,sumber,
    konstruksi:KONSTRUKSI_STAFF.map(n=>({name:n,respon:AB[n]||0,survei:CD[n]||0})),
    media:MEDIA_STAFF.map(n=>({name:n,respon:AB[n]||0,survei:CD[n]||0})),
    closing:{count:0,latest:null}
  };
  const det=parseRSCHDetail(rschRows);data.leads=det.leads;data.surveis=det.surveis;
  if(closingRows&&closingRows.length){
    const body=closingRows.filter(r=>{const m=(r[1]||'').trim();return m!==''&&m.toLowerCase()!=='nama marketing';});
    const countUnits=u=>{const s=(u||'').trim();if(!s)return 1;const parts=s.split(/\s*(?:&|\+|,|\/|\bdan\b)\s*/i).map(x=>x.trim()).filter(Boolean);return parts.length||1;};
    const list=body.map(r=>({tgl:(r[3]||'').trim(),konsumen:(r[2]||'').trim(),marketing:(r[1]||'').trim(),proyek:(r[5]||'').trim(),unit:(r[6]||'').trim(),units:countUnits(r[6])}));
    const totalUnits=list.reduce((a,c)=>a+c.units,0);
    data.closing={count:list.length,units:totalUnits,list,latest:list[list.length-1]||null};
  }
  return data;
}

function teamAgg(data){
  const out={};
  for(const t in TEAMS){const names=[...TEAMS[t].members,TEAMS[t].leader];
    out[t]={respon:names.reduce((a,n)=>a+(data.respon[n]||0),0),survei:names.reduce((a,n)=>a+(data.survei[n]||0),0)};}
  return out;
}
function topN(obj,n){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function kpi(lab,val,chg,cls){return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="chg ${cls||'mini'}" ${cls?'':'style="color:var(--muted)"'}>${chg||''}</div></div>`;}
function chartH(cfg,sm){if(cfg.type==='donut')return sm?225:240;if(cfg.type==='bars')return sm?255:290;if(cfg.type==='hbar'){const n=(cfg.data||[]).length;return Math.max(sm?210:250,60+n*(sm?24:27));}return sm?265:300;}

function parseHarga(t){if(!t)return 0;let s=String(t).toLowerCase().replace(/rp/g,'').replace(/\/\s*m2?/g,'').replace(/per\s*m2?/g,'').replace(/\s/g,'');let mult=1;if(/(jt|juta)/.test(s))mult=1e6;else if(/(rb|ribu)/.test(s))mult=1e3;const num=parseFloat(s.replace(/[^0-9.,]/g,'').replace(',','.'));return isNaN(num)?0:Math.round(num*mult);}

async function fetchLH(){
  const out=[];
  for(const hunter in SHEET_LH){
    const url=SHEET_LH[hunter];if(!url)continue;
    let rows;try{rows=await fetchCSV(url);}catch(e){continue;}
    const hi=rows.findIndex(r=>r.some(c=>/area/i.test(c||''))&&r.some(c=>/penawaran|harga/i.test(c||'')));
    if(hi<0)continue;
    const hdr=rows[hi].map(c=>(c||'').trim().toLowerCase());
    const col=n=>hdr.findIndex(h=>h.includes(n));
    const cA=col('area'),cK=col('kelurahan'),cH=col('penawaran'),cL=col('luas'),cLg=col('legalitas'),cM=col('maps'),cD=col('detail singkat'),cN=col('mediator'),cT=col('tanggal'),cNego=col('nego');
    for(let i=hi+1;i<rows.length;i++){

      if(!area&&!kel)continue;
      const detail=((cD>=0?r[cD]:'')||'').trim(),dl=detail.toLowerCase();const hargaText=((cH>=0?r[cH]:'')||'').trim();
      let status='Baru';
      if(/tidak\s*(di)?rekomendasi/.test(dl))status='Tidak Rekomendasi';
      else if(cNego>=0&&(r[cNego]||'').trim())status='Nego';
      out.push({hunter,area,kelurahan:kel,mediator:((cN>=0?r[cN]:'')||'').trim(),tanggal:((cT>=0?r[cT]:'')||'').trim(),hargaText,hargaNum:parseHarga(hargaText),luas:parseLuas(cL>=0?r[cL]:''),legalitas:((cLg>=0?r[cLg]:'')||'').trim().toUpperCase(),maps:((cM>=0?r[cM]:'')||'').trim(),detail,status});
    }
  }
  return out;
}

  if(s==='HP'||s.includes('HOT'))return {code:'HP',label:'Hot Prospek',cls:'t-red'};
  if(s==='MP'||s.includes('MEDIUM'))return {code:'MP',label:'Medium Prospek',cls:'t-amber'};
  if(s==='LP'||s.includes('LOW'))return {code:'LP',label:'Low Prospek',cls:'t-blue'};
  return null;}
/* Analisis marketing paling perlu didorong — skor gabungan respon+survei+closing+konversi (per bulan aktif) */
function leastPerformer(data){
  const roster=[];Object.values(TEAMS).forEach(t=>{roster.push(t.leader);t.members.forEach(m=>roster.push(m));});
  const uniq=[...new Set(roster)];if(!uniq.length)return [];
  const clCount={};(data.closing.list||[]).forEach(c=>{const m=(c.marketing||'').trim();if(m)clCount[m]=(clCount[m]||0)+(c.units||1);});
  const rows=uniq.map(n=>{const respon=data.respon[n]||0,survei=data.survei[n]||0,closing=clCount[n]||0;
    return {n,respon,survei,closing,convS:respon?survei/respon:0,convC:survei?closing/survei:0};});
  const mx=k=>Math.max(1,...rows.map(r=>r[k]));const mR=mx('respon'),mS=mx('survei'),mC=mx('closing');
  rows.forEach(r=>{r.score=0.20*(r.respon/mR)+0.30*(r.survei/mS)+0.35*(r.closing/mC)+0.15*Math.min(1,r.convS);});
  rows.sort((a,b)=>a.score-b.score||a.respon-b.respon||a.n.localeCompare(b.n));
  return rows;
}

function activeCalKey(){const m=RSC_MONTHS.find(x=>x.key===ACTIVE_MONTH);return m?parseTgl(m.label).k:Infinity;}
function mdByCal(ck){if(ck===Infinity)return null;const m=RSC_MONTHS.find(x=>parseTgl(x.label).k===ck);return m?MONTH_DATA[m.key]:null;}
function rscPrev(){return mdByCal(activeCalKey()-1);}
function cntMonth(list,ck,f){if(!list||ck===Infinity)return 0;return list.filter(x=>parseTgl((typeof f==='function'?f(x):x[f])||'').k===ck).length;}
function konsRespon(d){return d&&d.konstruksi?d.konstruksi.reduce((a,s)=>a+(s.respon||0),0):0;}
function konsSurvei(d){return d&&d.konstruksi?d.konstruksi.reduce((a,s)=>a+(s.survei||0),0):0;}
function deltaBadge(cur,prev){
  if(prev==null||ACTIVE_MONTH==='kumulatif')return '';
  if(prev===0)return cur>0?' <span class="delta up">▲ baru</span>':'';
  const d=Math.round((cur-prev)/prev*100);
  if(d>0)return ' <span class="delta up">▲ '+d+'%</span>';
  if(d<0)return ' <span class="delta down">▼ '+Math.abs(d)+'%</span>';
  return ' <span class="delta flat">– 0%</span>';
}

/* ===== Note marketing terlemah — 3 kolom (leads / survei / closing terendah) ===== */
function noteCards(data,roster){
  roster=[...new Set(roster)];if(!roster.length)return '';
  const clCount={};(data.closing.list||[]).forEach(c=>{const m=(c.marketing||'').trim();if(m)clCount[m]=(clCount[m]||0)+(c.units||1);});
  const rows=roster.map(n=>({n,respon:data.respon[n]||0,survei:data.survei[n]||0,closing:clCount[n]||0}));
  const minBy=k=>rows.slice().sort((a,b)=>a[k]-b[k]||a.n.localeCompare(b.n))[0];
  const wL=minBy('respon'),wS=minBy('survei'),wC=minBy('closing');
  const cRS=r=>r.respon?Math.round(r.survei/r.respon*100):0;
  const cSC=r=>r.survei?Math.round(r.closing/r.survei*100):0;
  const c=(title,r,val,unit,sub)=>`<div class="wcard"><div class="wleft"><div class="wt">📉 ${title}</div><div class="wn"><span class="avatar">${r.n.slice(0,2).toUpperCase()}</span><b>${r.n}</b></div><div class="wv">${val} <span class="mini">${unit}</span></div></div><div class="wsub">${sub}</div></div>`;
  return `<div class="wgrid">
    ${c('Leads Terendah',wL,wL.respon,'leads','Konversi→survei '+cRS(wL)+'% · survei '+wL.survei+' · closing '+wL.closing)}
    ${c('Survei Terendah',wS,wS.survei,'survei','Konversi respon→survei '+cRS(wS)+'% · leads '+wS.respon+' · closing '+wS.closing)}
    ${c('Closing Terendah',wC,wC.closing,'closing','Konversi survei→closing '+cSC(wC)+'% · leads '+wC.respon+' · survei '+wC.survei)}
  </div>`;
}

function parseTable(rows){
  if(!rows||!rows.length)return {header:[],data:[]};
  let hi=rows.findIndex(r=>r.filter(c=>(c||'').trim()!=='').length>=2);if(hi<0)hi=0;
  let header=rows[hi].map(c=>(c||'').trim());
  let last=header.length;while(last>0&&header[last-1]==='')last--;header=header.slice(0,Math.max(last,1));
  const data=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const vals=header.map((_,j)=>((r[j]==null?'':r[j])+'').trim());if(vals.some(v=>v!==''))data.push(vals);}
  return {header,data};
}

function parseHRDStaff(rows){
  if(!rows||!rows.length)return [];
  let hi=rows.findIndex(r=>r.some(c=>/nama panggilan/i.test(c||'')));if(hi<0)hi=rows.findIndex(r=>r.some(c=>/nama lengkap/i.test(c||'')));if(hi<0)return [];

  const cN=col('nama lengkap'),cP=col('nama panggilan'),cU=col('usia'),cG=col('jenis kelamin'),cM=col('tanggal masuk'),cE=col('pendidikan'),cJ=col('jurusan'),cJab=col('jabatan'),cPen=col('penempatan');

    out.push({nama:nm,full:((cN>=0?r[cN]:'')||nm).toString().trim(),usia,gender:((cG>=0?r[cG]:'')||'').toString().trim(),pend:((cE>=0?r[cE]:'')||'').toString().trim(),jurusan:((cJ>=0?r[cJ]:'')||'').toString().trim(),masuk:((cM>=0?r[cM]:'')||'').toString().trim(),jabatan:((cJab>=0?r[cJab]:'')||'').toString().trim(),penempatan:((cPen>=0?r[cPen]:'')||'').toString().trim()});}

      body+=`<tr${s.resign?' style="opacity:.6"':''}><td><span class="avatar">${(s.nama||'?').slice(0,2).toUpperCase()}</span><b>${s.nama||'—'}</b>${s.resign?' <span class="tag t-red" style="font-size:9.5px;padding:1px 6px">resign</span>':''}<div class="mini">${s.jab||''}</div></td><td>${s.masuk||'—'}</td><td>${s.resign?'—':s.ten.text}</td><td>${s.cat?'<span class="catnote">'+s.cat+'</span>':'<span class="mini">—</span>'}</td></tr>`;});
    return `<div style="max-height:520px;overflow:auto"><table class="ppjb big"><thead><tr><th>Nama</th><th>Tanggal Masuk</th><th>Lama Aktif Bekerja</th><th>${catColLabel}</th></tr></thead><tbody>${body}</tbody></table></div>`;
  };
  const rTag=s=>s==='Lolos'?'t-green':s==='Ditolak'?'t-red':'t-gray';
  const recRows=recruit.map((c,i)=>{const st=stNorm(c.status||c.hr||'');const joined=((c.join||'').trim()!=='')||st==='Lolos/Join';const hasil=joined?'Lolos':(st==='Tidak Lolos'||st==='Mundur'||st==='Tidak Hadir')?'Ditolak':'Proses';
    return `<tr><td class="num mini">${i+1}</td><td><b>${c.nama||'—'}</b></td><td>${c.penempatan||'—'}</td><td>${c.status||c.hr||'—'}</td><td><span class="tag ${rTag(hasil)}">${hasil}</span></td><td>${c.join||'—'}</td></tr>`;}).join('')||'<tr><td colspan="6" class="mini">Belum ada data.</td></tr>';
  const monRows=monthly.map(m=>`<tr><td><b>${m.bulan}</b></td><td class="num">${m.undang}</td><td class="num">${m.hadir}</td><td class="num">${m.tdkhadir}</td><td class="num">${m.losHR}</td><td class="num">${m.losUser}</td><td class="num"><span class="tag t-green">${m.join}</span></td></tr>`).join('')||'<tr><td colspan="7" class="mini">Belum ada data.</td></tr>';
  const tabs=`<div class="tabs" id="hrdViewTabs"><button data-view="all" class="active">Ringkasan Divisi</button><button data-view="staff">Data Staff</button><button data-view="rekrut">Rekrutmen</button></div>`;
  const hrdCmp=cmpLine('CV masuk',cntMonth(recruit,activeCalKey(),'cvMasuk'),cntMonth(recruit,activeCalKey()-1,'cvMasuk'));
  const ringkasan=`<div class="hrdview" data-view="all">
    <div class="kpis">${kpi('Total Staff',nS,'kumulatif','up')+kpi('Marketing',nMk,'staff penjualan')+kpi('Back Office',nBO,'BO / support')+kpi('CV Masuk',cvMasuk,'pelamar')+kpi('Diterima Kerja',lolos,'lolos rekrutmen','up')}</div>
    ${hrdCmp}
    <h2 class="sh"><span class="dot"></span>Komposisi Staff</h2>
    <div class="grid g2">${cardChart('Marketing vs Back Office','klasifikasi divisi',divDonut,true)}${cardChart('Staff per Kantor','Jogja vs Madiun',officeDonut,true)}</div>
    <h2 class="sh"><span class="dot"></span>Rekrutmen (Kumulatif)</h2>
    <div class="grid g2">${cardChart('Hasil Rekrutmen','lolos vs ditolak',hasilDonut,true)}<div class="card"><h3>Ringkasan Rekrutmen</h3><div class="sub">akumulasi semua kandidat</div><ul style="list-style:none;padding:0;margin:0;font-size:14px"><li style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between"><span>CV masuk</span><b>${cvMasuk}</b></li><li style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between"><span>Mengikuti interview</span><b>${interview}</b></li><li style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between"><span>Lolos &amp; diterima kerja</span><b style="color:#16a34a">${lolos}</b></li><li style="padding:9px 0;display:flex;justify-content:space-between"><span>Ditolak / gagal</span><b style="color:#dc2626">${ditolak}</b></li></ul></div></div>
  </div>`;
  const staffView=`<div class="hrdview" data-view="staff" style="display:none">
    <div class="kpis">${kpi('Total Staff',nS,'kumulatif','up')+kpi('Marketing',nMk,'staff penjualan')+kpi('Back Office',nBO,'BO / support')+kpi('Staff Jogja',nJ,'kantor')+kpi('Staff Madiun',nM,'kantor')}</div>
    <h2 class="sh"><span class="dot"></span>Klasifikasi Staff</h2>
    <div class="grid g2">${cardChart('Marketing vs Back Office','klasifikasi divisi',divDonut,true)}${cardChart('Staff per Kantor','Jogja vs Madiun',officeDonut,true)}</div>
    <h2 class="sh"><span class="dot"></span>Staff Jogja <span class="mini">(${nJ} aktif · ${jMk} marketing / ${jBO} BO${resJ?' · '+resJ+' resign':''})</span></h2>
    <div class="card">${staffTable(staffJ)}</div>
    <h2 class="sh"><span class="dot"></span>Staff Madiun <span class="mini">(${nM} aktif · ${mMk} marketing / ${mBO} BO${resM?' · '+resM+' resign':''})</span></h2>
    <div class="card">${staffTable(staffM)}</div>
  </div>`;
  HRD_RECRUIT=recruit;HRD_MONTHLY=recruitMonthly(recruit);REKRUT_SEL=HRD_MONTHLY.length?HRD_MONTHLY.length-1:'all';
  const cvNote=HRD_MONTHLY.length?'':'<div class="note">ℹ️ Belum ada kolom <b>CV Masuk</b> terbaca — breakdown per bulan otomatis muncul begitu kolom tanggal CV masuk terisi di sheet interview.</div>';
  const monRows2=HRD_MONTHLY.map(m=>`<tr><td><b>${m.bulan}</b></td><td class="num">${m.cv}</td><td class="num">${m.hadir}</td><td class="num"><span class="tag t-green">${m.join}</span></td><td class="num"><span class="tag t-red">${m.ditolak}</span></td><td class="num">${m.proses}</td></tr>`).join('')||'<tr><td colspan="6" class="mini">Belum ada data per bulan (menunggu kolom CV masuk).</td></tr>';
  const rekrutView=`<div class="hrdview" data-view="rekrut" style="display:none">
    ${cvNote}
    <h2 class="sh" style="margin-top:2px"><span class="dot"></span>Rekrutmen per Bulan <span class="mini">(berdasarkan tanggal CV masuk)</span></h2>
    <div class="tabs" id="rekrutMonths"></div>
    <div id="rekrutSel"></div>
    <h2 class="sh"><span class="dot"></span>Rangkuman per Bulan</h2>
    <div class="card"><div style="max-height:360px;overflow:auto"><table class="big"><thead><tr><th>Bulan</th><th class="num">CV Masuk</th><th class="num">Interview</th><th class="num">Lolos</th><th class="num">Ditolak</th><th class="num">Proses</th></tr></thead><tbody>${monRows2}</tbody></table></div></div>
  </div>`;
  const noteWrap=live?'<div class="note" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">✅ Data staff live per tab: <b>Marketing/BO Jogja</b> &amp; <b>Marketing/BO Madiun</b> — tiap tab jadi kategorinya langsung. Rekrutmen live dari tab interview.</div>':'<div class="note">ℹ️ HRD menampilkan snapshot; otomatis LIVE setelah deploy. Tiap tab (Marketing/BO Jogja & Madiun) jadi kategorinya langsung.</div>';
  el.innerHTML=noteWrap+tabs+ringkasan+staffView+rekrutView;
  const sel=v=>{el.querySelectorAll('#hrdViewTabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));el.querySelectorAll('.hrdview').forEach(p=>p.style.display=p.dataset.view===v?'block':'none');};
  el.querySelectorAll('#hrdViewTabs button').forEach(b=>b.onclick=()=>sel(b.dataset.view));
  SUBTAB.hrd=sel;rekrutRenderSel();
}
async function loadHRD(){let d=null;try{d=await fetchHRD();}catch(e){}
  const staff=(d&&d.staff&&d.staff.length)?d.staff:FALLBACK_HRD.staff;   // live per-tab; fallback baked hanya utk preview
  const recruit=(d&&d.recruit&&d.recruit.length)?d.recruit:FALLBACK_HRD.recruit;
  const monthly=(d&&d.monthly&&d.monthly.length)?d.monthly:FALLBACK_HRD.monthly;
  const catatan=(d&&d.catatan&&d.catatan.length)?d.catatan:FALLBACK_CATATAN;
  const live=!!(d&&d.staff&&d.staff.length);
  HRD_LAST={staff,recruit,monthly,catatan,live};
  renderHRD({staff,recruit,monthly,catatan},!!live);}
async function loadKons(){
  let aryo=null,algi=null;
  try{if(SHEET_KONS.aryo)aryo=parseTable(await fetchCSV(SHEET_KONS.aryo));}catch(e){}
  try{if(SHEET_KONS.algi)algi=parseTable(await fetchCSV(SHEET_KONS.algi));}catch(e){}
  KONS_WORK={};if(aryo&&aryo.data.length)KONS_WORK.aryo=aryo;if(algi&&algi.data.length)KONS_WORK.algi=algi;
  renderKonstruksi(RSC);
}

/* ============================================================
   Init & navigasi
   ============================================================ */
const titles={overview:['Ringkasan','Overview Perusahaan'],adminmkt:['Administrasi','Admin Marketing'],hrd:['Administrasi','HRD'],marketing:['Operasional','Marketing'],media:['Operasional','Media'],landhunter:['Operasional','Land Hunter — Calon Lokasi'],konstruksi:['Operasional','Konstruksi']};
const SUBTAB={};
function goTab(id,sub){
  if(!titles[id])return;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active', x.dataset.sec===id && ((x.dataset.sub||'')===(sub||''))));
  // expand parent submenu, collapse others
  document.querySelectorAll('.nav .parent').forEach(p=>p.classList.toggle('open',p.dataset.sec===id));
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('show',s.id===id));
  document.getElementById('crumb').textContent=titles[id][0];document.getElementById('ptitle').textContent=titles[id][1];window.scrollTo({top:0,behavior:'smooth'});
  if(SUBTAB[id])SUBTAB[id](sub||'all');
}
document.querySelectorAll('.nav button[data-sec]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();goTab(b.dataset.sec,b.dataset.sub);});
function setStatus(live,msg){const p=document.getElementById('statusPill');p.className='pill '+(live?'live':'snap');p.textContent=(live?'● LIVE':'● SNAPSHOT');document.getElementById('dataNote').innerHTML=msg?`<div class="note">${msg}</div>`:'';}
function stamp(){const d=new Date();document.getElementById('lastUpdate').textContent='Update: '+d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}

function classify(rows){
  const flat=rows.slice(0,60).map(r=>(r||[]).join('|')).join('\n');
  if(/Total Respon online|SUMARY/i.test(flat))return 'rsch';
  if(/Tanggal Closing|Nama Konsumen/i.test(flat))return 'closing';
  return 'unknown';
}
function emptyData(){return {funnel:{respon:0,noRespon:0,intens:0,tertarik:0,survei:0},respon:{},survei:{},proyekRespon:{},proyekSurvei:{},sumber:{},konstruksi:KONSTRUKSI_STAFF.map(n=>({name:n,respon:0,survei:0})),media:[],closing:{count:0,units:0,list:[],latest:null},leads:[],surveis:[]};}
function mergeData(arr){
  const out=emptyData();const add=(t,s)=>{for(const k in (s||{}))t[k]=(t[k]||0)+(s[k]||0);};
  arr.forEach(d=>{if(!d)return;['respon','noRespon','intens','tertarik','survei'].forEach(k=>out.funnel[k]+=d.funnel[k]||0);
    add(out.respon,d.respon);add(out.survei,d.survei);add(out.proyekRespon,d.proyekRespon);add(out.proyekSurvei,d.proyekSurvei);add(out.sumber,d.sumber);
    out.leads=out.leads.concat(d.leads||[]);out.surveis=out.surveis.concat(d.surveis||[]);
    if(d.closing&&d.closing.list)out.closing.list=out.closing.list.concat(d.closing.list);});
  out.closing.count=out.closing.list.length;out.closing.units=out.closing.list.reduce((a,c)=>a+(c.units||1),0);out.closing.latest=out.closing.list[out.closing.list.length-1]||null;
  out.konstruksi=KONSTRUKSI_STAFF.map(n=>({name:n,respon:out.respon[n]||0,survei:out.survei[n]||0}));
  return out;
}
async function fetchMonth(m){
  const urls=[m.csvA,m.csvB].filter(Boolean);if(!urls.length)return null;
  try{const parsed=await Promise.all(urls.map(fetchCSV));let rsch=null,closing=null;
    parsed.forEach(rows=>{const k=classify(rows);if(k==='rsch')rsch=rows;else if(k==='closing')closing=rows;});
    if(!rsch)return null;return buildFromRows(rsch,closing||[]);
  }catch(e){return null;}
}
function monthLabel(key){const m=RSC_MONTHS.find(x=>x.key===key);return m?m.label:key;}
function buildTrend(){TREND=RSC_MONTHS.map(m=>{const d=MONTH_DATA[m.key];return {key:m.key,label:m.label,short:m.label.split(' ')[0].slice(0,3),respon:d?d.funnel.respon:0,survei:d?d.funnel.survei:0,closing:d?(d.closing.units||0):0};});}
function fillMonthSelect(){
  const sel=document.getElementById('monthSel');if(!sel)return;
  sel.innerHTML=RSC_MONTHS.map(m=>{const d=MONTH_DATA[m.key];const has=d&&d.funnel.respon;return `<option value="${m.key}">${m.label}${has?'':(!m.csvA?' (blm tersambung)':' (kosong)')}</option>`;}).join('')+`<option value="kumulatif">★ Total Kumulatif</option>`;
  sel.value=ACTIVE_MONTH;sel.onchange=()=>applyMonth(sel.value);
}
function renderTrend(){
  const el=document.getElementById('ovTrend');if(!el)return;const t=TREND;
  const resBar={type:'bars',labels:t.map(x=>x.short),data:t.map(x=>x.respon),color:C.blue};
  const svBar={type:'bars',labels:t.map(x=>x.short),data:t.map(x=>x.survei),color:C.amber};
  const clBar={type:'bars',labels:t.map(x=>x.short),data:t.map(x=>x.closing),color:C.violet};
  el.innerHTML=`<div class="grid g3">${cardChart('Respon per Bulan','tren Jul–Des',resBar,true)}${cardChart('Survei per Bulan','tren Jul–Des',svBar,true)}${cardChart('Closing (unit) per Bulan','tren Jul–Des',clBar,true)}</div>`;
}
function applyMonth(key){
  ACTIVE_MONTH=key;TEAMS=teamsForMonth(key);let data,live,msg;
  if(key==='kumulatif'){const arr=RSC_MONTHS.map(m=>MONTH_DATA[m.key]).filter(d=>d&&d.funnel.respon);data=mergeData(arr);live=arr.length>0;msg=live?('★ Menampilkan <b>total kumulatif</b> dari '+arr.length+' bulan berisi data.'):'Belum ada bulan yang berisi data.';}
  else{data=MONTH_DATA[key]||emptyData();const has=data.funnel.respon;const m=RSC_MONTHS.find(x=>x.key===key);live=!!has;msg=has?'':(m&&!m.csvA?('⚙️ <b>'+m.label+'</b> belum tersambung — Publish-to-web tab RSCH & DATA CLOSING sheet bulan ini, lalu kirim URL-nya ke Luma buat diaktifkan.'):('ℹ️ <b>'+monthLabel(key)+'</b> belum ada data di sheet.'));}
  renderAll(data);setStatus(live,msg);stamp();
  renderTrend();renderDivisiRingkasan();renderOverviewExtras();if(PPJB_STATE)renderPPJB(PPJB_STATE.list,PPJB_STATE.live);
  if(HRD_LAST)renderHRD({staff:HRD_LAST.staff,recruit:HRD_LAST.recruit,monthly:HRD_LAST.monthly,catatan:HRD_LAST.catatan},HRD_LAST.live);
  const sel=document.getElementById('monthSel');if(sel)sel.value=key;
}
async function loadRSC(){
  const arr=await Promise.all(RSC_MONTHS.map(m=>fetchMonth(m)));
  RSC_MONTHS.forEach((m,i)=>{MONTH_DATA[m.key]=arr[i];});
  if(!MONTH_DATA['jul'])MONTH_DATA['jul']=FALLBACK;
  buildTrend();
  let def='jul';RSC_MONTHS.forEach(m=>{if(MONTH_DATA[m.key]&&MONTH_DATA[m.key].funnel.respon)def=m.key;});
  ACTIVE_MONTH=def;fillMonthSelect();applyMonth(def);
}
async function loadAll(){await loadRSC();await Promise.all([loadLH(),loadMedia(),loadPPJB(),loadHRD(),loadKons()]);renderDivisiRingkasan();renderOverviewExtras();}
document.getElementById('refreshBtn').onclick=loadAll;
renderKonstruksi();
loadAll();
</script>
